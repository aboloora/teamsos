<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بيانات العاملين — مقر السكن المركزي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--paper:#fffdf8;--ink:#1d2a26;--muted:#6b756f;--line:#e2ddd1;
  --brand:#0f5c4a;--brand-2:#147a62;--accent:#d9952b;--leave:#b4532a;--leave-bg:#f8e7dc;
  --chip:#ece7db;--shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(15,92,74,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"IBM Plex Sans Arabic","Noto Sans Bengali",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
button{font:inherit;cursor:pointer}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* Header */
header{background:var(--brand);color:#fff;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 18px);pointer-events:none}
.hd{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:34px 0 80px;position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:14px}
.logo .mark{width:52px;height:52px;border-radius:14px;background:var(--accent);display:grid;place-items:center;color:var(--brand);font-weight:700;font-size:24px}
.logo h1{font-size:26px;font-weight:700;letter-spacing:-.3px}
.logo p{opacity:.8;font-size:14px}
.date{font-size:13px;opacity:.85;background:rgba(255,255,255,.1);padding:8px 14px;border-radius:999px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:-52px;position:relative;z-index:2}
.stat{background:var(--paper);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stat .lbl{color:var(--muted);font-size:13px;font-weight:500}
.stat .val{font-size:34px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted)}
.stat.s1 .val{color:var(--brand)} .stat.s2 .val{color:var(--brand-2)} .stat.s3 .val{color:var(--leave)} .stat.s4 .val{color:var(--accent)}

/* Layout */
main{display:grid;grid-template-columns:300px 1fr;gap:22px;margin:26px auto 60px}
aside .panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);position:sticky;top:16px}
.panel h3{font-size:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.panel h3 small{color:var(--muted);font-weight:400;font-size:12px}
.jobs{display:flex;flex-direction:column;gap:4px;max-height:calc(100vh - 140px);overflow:auto}
.job{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:start;background:none;border:0;padding:8px 10px;border-radius:10px;color:var(--ink)}
.hint{font-size:12px;color:var(--muted);margin:-6px 0 10px}
.job .nm{display:flex;align-items:center;gap:8px}
.ck{width:16px;height:16px;border:1.5px solid #bdb5a3;border-radius:5px;flex:none;display:grid;place-items:center;background:#fff}
.job.on .ck{background:var(--accent);border-color:var(--accent)}
.job.on .ck::after{content:'';width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.job[data-j=""] .ck{display:none}
.job:hover{background:var(--chip)}
.job.on{background:var(--brand);color:#fff}
.job .nm{font-size:14px;font-weight:500}
.job .ct{font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.job .bar{grid-column:1/-1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.job .bar i{display:block;height:100%;background:var(--brand-2);border-radius:4px}
.job.on .bar{background:rgba(255,255,255,.25)} .job.on .bar i{background:var(--accent)}
.job.leave .bar i{background:var(--leave)}

/* Toolbar */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.search{flex:1;min-width:220px;position:relative}
.search input{width:100%;padding-block:12px;padding-inline:44px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper);font:inherit;font-size:15px;color:var(--ink);outline:none}
.search input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,122,98,.15)}
.search svg{position:absolute;inset-inline-start:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.seg{display:flex;background:var(--chip);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.count{font-size:13px;color:var(--muted);margin-bottom:12px}
.count b{color:var(--ink)}

/* Cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;transition:transform .15s,box-shadow .15s;cursor:pointer;text-align:start;color:inherit}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#cfc8b8}
.top{display:flex;gap:12px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:#fff;font-size:17px;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.av.ph{background:#ddd!important}
.av .no{z-index:1;position:absolute;bottom:-4px;left:-4px;background:var(--paper);color:var(--muted);border:1px solid var(--line);font-size:10px;border-radius:999px;padding:0 5px;line-height:16px;font-weight:600}
.who .nm{font-weight:600;font-size:15px;line-height:1.35}
.who .nat{font-size:12px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:#e3efe9;color:var(--brand)}
.tag.leave{background:var(--leave-bg);color:var(--leave)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px dashed var(--line);padding-top:10px}
.meta div{font-size:12px;color:var(--muted)}
.meta b{display:block;font-size:14px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.nophoto{font-size:11px;color:var(--accent);font-weight:600}

/* Table */
.tbl{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{background:var(--chip);text-align:start;padding:12px 14px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
td{padding:11px 14px;border-top:1px solid var(--line);white-space:nowrap}
tr.r{cursor:pointer} tr.r:hover td{background:#faf7ef}
td.num{font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
.empty{text-align:center;color:var(--muted);padding:60px 20px;background:var(--paper);border-radius:16px;border:1px dashed var(--line)}

/* Modal */
.ov{position:fixed;inset:0;background:rgba(20,30,26,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:50;backdrop-filter:blur(3px)}
.ov.open{display:flex}
.modal{background:var(--paper);border-radius:20px;width:100%;max-width:440px;max-height:92vh;overflow-y:auto;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.25);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.mh{background:var(--brand);color:#fff;padding:24px;display:flex;gap:16px;align-items:center;position:relative}
.mh .av{width:64px;height:64px;font-size:22px;border:3px solid rgba(255,255,255,.3)}
.photo{width:100%;aspect-ratio:4/5;max-height:340px;object-fit:cover;border-radius:14px;margin-bottom:8px;background:#eee;display:block}
.nopic{width:100%;padding:28px;text-align:center;border:1px dashed var(--line);border-radius:14px;color:var(--muted);font-size:13px;margin-bottom:8px}
.mh h2{font-size:19px;line-height:1.35}
.mh .x{position:absolute;inset-inline-end:14px;top:14px;background:rgba(255,255,255,.15);border:0;color:#fff;width:32px;height:32px;border-radius:50%;font-size:18px}
.mb{padding:20px 24px 24px;display:flex;flex-direction:column;gap:2px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}
.row span{color:var(--muted)}
.row b{font-variant-numeric:tabular-nums;font-weight:600}
.row .cp{border:1px solid var(--line);background:none;border-radius:8px;font-size:12px;padding:3px 9px;margin-inline-start:8px;color:var(--brand)}
.acts{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;text-align:center;padding:11px;border-radius:12px;font-weight:600;font-size:14px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:none}
.btn.call{display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;padding:13px}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn[aria-disabled=true]{opacity:.45;pointer-events:none}
.upd{display:flex;gap:8px;margin:2px 0 10px}
.upd .btn{padding:9px;font-size:13px}
.btn.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.newb{display:inline-block;font-size:10px;font-weight:700;background:var(--accent);color:#fff;border-radius:999px;padding:0 6px;margin-inline-start:6px;vertical-align:middle}
.busy{opacity:.6;pointer-events:none}
.sjbox{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.sjbox label{font-size:14px;font-weight:600;color:var(--brand)}
.sjbox input{padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink);outline:none}
.sjbox input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,122,98,.15)}
.sjsave{flex:none;padding:10px;font-size:14px;cursor:pointer}
.sjsave:disabled{opacity:.45;cursor:default}
.sjbox small.ok{color:var(--brand-2);font-weight:600}
.sjbox small.warn{color:var(--accent);font-weight:600}
.sjbox small.err{color:var(--leave);font-weight:600}
.sjbox small.conn{color:var(--muted);font-size:11px}
.sjbox small:empty{display:none}
.sjtr{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink);background:var(--chip);border-radius:10px;padding:8px 10px}
.sjtr:empty{display:none}
.sjtr b{color:var(--muted);font-weight:600}
.sjbox small{font-size:12px;color:var(--muted);min-height:16px}
td.sj{color:var(--brand);font-weight:600;white-space:normal;min-width:120px}
.dash{color:#c9c2b2;font-weight:400}
.lang{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:4px;gap:2px}
.lang button{border:0;background:none;color:#fff;padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:.8}
.lang button.on{background:#fff;color:var(--brand);opacity:1}
.hdr-r{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
html[lang=bn] body{font-family:"Noto Sans Bengali","IBM Plex Sans Arabic",system-ui,sans-serif}
@keyframes fl{0%{background:#fde9c4}100%{background:transparent}}
tr.r.flash td{animation:fl 2.2s ease-out}
@media (max-width:700px){.tbl tr.r.flash{animation:fl 2.2s ease-out}}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;transition:transform .2s;z-index:60}
.toast.show{transform:translateX(-50%) translateY(0)}

footer{text-align:center;color:var(--muted);font-size:12px;padding:0 0 30px}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  aside .panel{position:static}
  .jobs{flex-direction:row;flex-wrap:wrap;max-height:none}
  .job{grid-template-columns:auto auto;background:var(--chip);padding:6px 12px;border-radius:999px}
  .job .bar{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
  .hd{flex-direction:column;align-items:flex-start;padding-bottom:70px}
}

.mini{width:36px;height:36px;border-radius:50%;object-fit:cover;vertical-align:middle;display:inline-grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.phi,.sjl{display:none}
main>*{min-width:0}
@media (max-width:700px){
  html,body{overflow-x:hidden}
  .wrap{padding:0 12px}
  .hd{padding:16px 14px 58px;gap:12px}
  .hdr-r{padding:0}
  .logo .mark{width:42px;height:42px;font-size:20px;border-radius:12px}
  .logo h1{font-size:20px}
  .logo p{font-size:12px}
  .hdr-r{width:100%;justify-content:space-between;gap:8px}
  .lang button{padding:6px 14px;font-size:13px}
  .date{display:none}
  .stats{gap:10px;margin-top:-44px}
  .stat{padding:12px 14px;border-radius:14px}
  .stat .lbl{font-size:12px}
  .stat .val{font-size:26px;margin-top:0}
  .stat .sub{font-size:11px}
  main{gap:14px;margin:14px auto 30px}
  aside .panel{padding:12px;border-radius:14px}
  .panel h3{margin-bottom:4px}
  .hint{margin:0 0 8px}
  .jobs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:4px;scrollbar-width:none}
  .jobs::-webkit-scrollbar{display:none}
  .job{flex:none;white-space:nowrap;padding:8px 12px}
  .toolbar{flex-direction:column;align-items:stretch;gap:8px}
  .search{min-width:0}
  .search input{font-size:16px;padding-block:11px}
  .seg{width:100%}
  .seg button{flex:1;padding:9px 6px}
  /* table -> list */
  .tbl{background:none;border:0;overflow:visible}
  .tbl table,.tbl tbody{display:block}
  .tbl thead{display:none}
  .tbl tr.r{display:grid;grid-template-columns:52px 1fr auto;grid-template-areas:"pic name n" "pic job job" "pic ph ph" "pic sj sj";column-gap:10px;row-gap:4px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
  .tbl tr.r:active{background:#faf7ef}
  .tbl tr.r td{border:0;padding:0;white-space:normal;background:none!important}
  .c-pic{grid-area:pic;align-self:start}
  .c-pic .mini{width:52px;height:52px;font-size:17px}
  .c-name{grid-area:name;font-size:15px;line-height:1.35}
  .c-n{grid-area:n;font-size:11px;color:var(--muted);align-self:start;background:var(--chip)!important;border-radius:999px;padding:1px 8px!important}
  .c-job{grid-area:job}
  .c-ph{grid-area:ph;font-size:14px;color:var(--muted);text-align:start}
  .c-ph .phi{display:inline;font-size:12px;margin-inline-end:4px}
  .c-sj{grid-area:sj;font-size:13px;min-width:0}
  .c-sj .sjl{display:inline;color:var(--muted);font-weight:400}
  .c-sj.empty-sj{display:none}
  .c-nat,.c-iq{display:none}
  .count{margin-bottom:8px}
  /* modal -> bottom sheet */
  .ov{padding:0;align-items:flex-end}
  .modal{max-width:none;border-radius:20px 20px 0 0;max-height:94vh;padding-bottom:env(safe-area-inset-bottom)}
  .mh{padding:16px 18px}
  .mh .av{width:54px;height:54px}
  .mh h2{font-size:17px}
  .mb{padding:14px 18px 18px}
  .photo{max-height:260px;aspect-ratio:auto;height:260px}
  .sjbox input{font-size:16px}
  .btn{padding:12px}
  .row{padding:10px 0}
  .row .cp{padding:6px 12px}
  .toast{bottom:16px;max-width:90vw;text-align:center}
  footer{padding:0 12px 20px}
  /* detail as in-page view */
  body.dm>div.wrap,body.dm main,body.dm footer{display:none}
  body.dm .ov{display:block;position:static;background:none;backdrop-filter:none;-webkit-backdrop-filter:none;padding:12px 12px 24px;margin-top:-44px;position:relative;z-index:3}
  body.dm .modal{border-radius:18px;max-height:none;overflow:visible;animation:none;box-shadow:var(--shadow)}
  body.dm .mh{border-radius:18px 18px 0 0;flex-wrap:wrap;padding-top:54px}
  .mh .x.back{width:auto;height:34px;border-radius:999px;padding:0 14px;font-size:14px;font-weight:600;top:12px}
  body.dm .photo{height:240px}
}

.gate{position:fixed;inset:0;z-index:100;background:var(--brand);display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto}
.gate::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 2px,transparent 2px 18px);pointer-events:none}
body.locked .gate{display:flex}
body.locked>header,body.locked>div.wrap,body.locked>main,body.locked>footer,body.locked .ov{display:none!important}
.gcard{position:relative;z-index:1;background:var(--paper);border-radius:20px;padding:28px 24px 24px;width:100%;max-width:400px;box-shadow:0 30px 60px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:12px}
.gcard h2{font-size:22px;text-align:center}
.gsub{text-align:center;color:var(--muted);font-size:13px;margin-top:-6px}
.gmark{width:56px;height:56px;border-radius:16px;background:var(--accent);color:var(--brand);font-weight:700;font-size:26px;display:grid;place-items:center;margin:6px auto 0}
.gcard label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.gcard input{padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:16px;background:#fff;color:var(--ink);outline:none;width:100%}
.gcard input:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(20,122,98,.15)}
.gcard input.bad{border-color:var(--leave)}
.gpw{position:relative}
.gpw input{padding-inline-end:44px}
.gpw button{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:18px;padding:6px;opacity:.6}
.gerr{color:var(--leave);font-size:13px;font-weight:600;min-height:18px;text-align:center}
.gbtn{padding:13px;font-size:16px;cursor:pointer}
.glang{display:flex;gap:4px;justify-content:center;background:var(--chip);border-radius:999px;padding:4px;width:max-content;margin:0 auto}
.glang button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:600;color:var(--muted)}
.glang button.on{background:var(--paper);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.who{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border-radius:999px;padding:4px 4px 4px 12px;font-size:13px;color:#fff}
html[dir=rtl] .who{padding:4px 12px 4px 4px}
.who button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600}
.who:empty,.who.hide{display:none}
.sjby{font-size:11px;color:var(--muted)}
.sjby:empty{display:none}
</style>
</head>
<body>
<div id="gate" class="gate">
  <form class="gcard" id="gForm" novalidate>
    <div class="glang" id="gLang"><button type="button" data-l="ar">عربي</button><button type="button" data-l="bn">বাংলা</button></div>
    <div class="gmark">س</div>
    <h2 data-i="gTitle"></h2>
    <p class="gsub" data-i="gSub"></p>
    <label><span data-i="gName"></span><input id="gN" type="text" autocomplete="name" maxlength="60" required></label>
    <label><span data-i="gEmail"></span><input id="gE" type="email" autocomplete="email" inputmode="email" dir="ltr" maxlength="100" required></label>
    <label><span data-i="gPass"></span><div class="gpw"><input id="gP" type="password" autocomplete="current-password" dir="ltr" required><button type="button" id="gEye" aria-label="show">👁</button></div></label>
    <div class="gerr" id="gErr"></div>
    <button type="submit" class="btn pri gbtn" data-i="gLogin"></button>
  </form>
</div>
<header>
  <div class="wrap hd">
    <div class="logo">
      <div class="mark">س</div>
      <div>
        <h1 data-i="title"></h1>
        <p data-i="subtitle"></p>
      </div>
    </div>
    <div class="hdr-r"><div class="who" id="who"><span id="whoName"></span><button type="button" id="logout" data-i="logout"></button></div><div class="lang" id="lang"><button data-l="ar">عربي</button><button data-l="bn">বাংলা</button></div><div class="date" id="today"></div></div>
  </div>
</header>

<div class="wrap">
  <section class="stats" id="stats"></section>
</div>

<main class="wrap">
  <aside>
    <div class="panel">

}

function filtered(){
  const q=norm(state.q.trim());
  return DATA.filter(d=>{
    if(state.jobs.size && !state.jobs.has(d.job)) return false;
    if(state.status==='leave' && d.job!==LEAVE) return false;
    if(state.status==='work' && d.job===LEAVE) return false;
    if(q && !(norm(d.name).includes(q) || d.iq.includes(q) || d.ph.includes(q) || norm(d.job).includes(q) || norm(J(d.job)).includes(q) || norm(sjAll(d.n)).includes(q))) return false;
    return true;
  });
}

function mini(d){return hasPic(d)?`<img class="mini" src="${src(d)}" loading="lazy" alt="">`:`<span class="mini ini" style="background:${color(d.job)}">${initials(d.name)}</span>`;}
function tag(j){return `<span class="tag ${j===LEAVE?'leave':''}">${J(j)}</span>`;}

function render(){
  const rows=filtered();
  $('#count').innerHTML = T('count',`<b>${rows.length}</b>`,total) + (state.jobs.size?` — ${[...state.jobs].map(J).join(LANG==='ar'?'، ':', ')}`:'');

  }
}

function refreshAll(){renderStats();render();

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});
    const W=480,H=600,r=Math.max(W/img.width,H/img.height),w=img.width*r,h=img.height*r;
    const c=document.createElement('canvas');c.width=W;c.height=H;
    c.getContext('2d').drawImage(img,(W-w)/2,(H-h)*0.4,w,h);
    return await new Promise(ok=>c.toBlob(ok,'image/jpeg',0.85));
  } finally{URL.revokeObjectURL(url);}
}
$('#file').addEventListener('change',async e=>{
  const f=e.target.files[0]; e.target.value=''; if(!f||openN==null)return;
  if(!f.type.startsWith('image/')){toast(T('pickImg'));return;}
  const n=openN, old=OV[n]&&OV[n].assetId, box=$('.modal'); box.classList.add('busy'); toast(T('uploading'));
  try{
    const blob=await shrink(f);
    const a=await ASSETS.upload(blob);
    await DB.doc('photos/'+n).set({assetId:a.id,updatedAt:new Date().toISOString()});
    OV[n]={assetId:a.id};
    if(old){try{await ASSETS.delete(old);}catch{}}
    toast(T('uploaded')); refreshAll();
  }catch(err){console.error(err);toast(T('uploadFail'));}
  finally{box.classList.remove('busy');}
});
async function revert(n){

  catch(err){console.error(err);toast(T('revertFail'));}
  finally{box.classList.remove('busy');}
}

const nk = s => norm(String(s||'').trim()).replace(/[.,،؛;:!?"'()\-_/]+/g,' ').replace(/\s+/g,' ').trim();
const DICT_IDX=(()=>{const m=new Map(); for(const row of DICT){ const e={ar:row[0],bn:row[1]}; for(const w of row) m.set(nk(w),e);} return m;})();
function localTr(text){ const e=DICT_IDX.get(nk(text)); return e?{ar:e.ar,bn:e.bn}:null; }
const hasAr = s => /[؀-ۿ]/.test(s), hasBn = s => /[ঀ-৿]/.test(s);
let SAMPLE=undefined; // undefined: not checked, null: unavailable
async function getSample(){ if(SAMPLE!==undefined) return SAMPLE; try{ SAMPLE = (window.claude&&claude.use) ? await withTimeout(claude.use('sample'),12000) : null; }catch{ SAMPLE=null; } return SAMPLE; }
async function translate(text){
  const loc=localTr(text);
  if(loc) return loc;
  try{ const r=await withTimeout(run('translate',TOKEN,text),20000); if(r&&r.ar&&r.bn) return {ar:String(r.ar).slice(0,80),bn:String(r.bn).slice(0,80)}; }catch(e){ console.warn('translate',e); }
  const s=null;
  if(s){
    try{
      const r=await withTimeout(s.json(
        'Translate this job title / occupation, written by a supervisor in Saudi Arabia (it may be in any language, dialect or misspelled), into Arabic and into Bengali. '
        +'Use the short, common job-title wording a worker would understand. If it is already in one of those languages, keep it (fixing spelling) and translate to the other. '
        +'Reply with only JSON like {"ar":"سواق قلاب","bn":"ডাম্প ট্রাক চালক"}.\n\nText: '+JSON.stringify(text),
        {modelTier:'quick', cache:{gcTime:86400000}}), 25000);
      if(r && typeof r.ar==='string' && typeof r.bn==='string' && r.ar.trim() && r.bn.trim()) return {ar:r.ar.trim().slice(0,80), bn:r.bn.trim().slice(0,80)};
    }catch(e){ console.warn('translate',e); if(e&&['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e.code)) SAMPLE=null; }
  }
  // no translator available: keep the text for whichever language it is written in
  return {ar: hasAr(text)?text:'', bn: hasBn(text)?text:''};
}

function sjStatus(msg,cls){ const el=$('#sjSt'); if(el){ el.textContent=msg; el.className=cls||''; } }
function updConn(){ const el=$('#sjConn'); if(!el) return; el.textContent = CAN_WRITE===false ? T('connView') : (DB_STATE==='none' ? T('connNone') : ''); }
async function saveSJ(n,val){
  if(sjBusy) return; sjBusy=true;
  val=(val||'').trim();
  const btn=$('#sjSave'); if(btn) btn.disabled=true;
  let entry=null, result='fail';
  try{
    if(val){
      const quick=localTr(val);
      const by=ME?ME.name:'';
      entry={text:val, ar:quick?quick.ar:(hasAr(val)?val:''), bn:quick?quick.bn:(hasBn(val)?val:''), by};
      showSJ(n,entry);                                   // appears in the table right away
      if(!quick){ sjStatus(T('translating')); const tr=await translate(val); entry={text:val, ar:tr.ar, bn:tr.bn, by}; showSJ(n,entry); }
    } else showSJ(n,null);
    sjStatus(T('saving'));
    const db = CAN_WRITE===false ? null : (DB || (DB_STATE==='none' ? null : await getDB()));
    if(db){
      try{ await withTimeout(entry ? db.doc('jobs/'+n).set(docOf(entry)) : db.doc('jobs/'+n).delete(), 10000); result='shared'; }
      catch(e){ console.error(e); if(e&&e.code==='invalid_argument') result='noperm'; }
    }

  } finally {
    sjBusy=false; const b=$('#sjSave'); if(b) b.disabled=false;
    const msg={shared:[T('savedOk'),'ok'],local:[CAN_WRITE===false?T('savedLocalOnly'):T('savedLocal'),'warn'],noperm:[T('noPerm'),'err'],fail:[T('saveFail'),'err']}[result];
    if(openN===n) sjStatus(msg[0],msg[1]);
    if(result==='shared'||result==='local'){ setTimeout(()=>{ if(openN===n){ closeModal(); toast(msg[0]); setTimeout(()=>flashRow(n),50);} },1400); }
    else toast(msg[0]);
  }
}

async function sha256(s){
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  return sha256js(s);
}
function sha256js(ascii){ // small fallback for contexts without crypto.subtle
  function r(v,a){return(v>>>a)|(v<<(32-a));} const mp=Math.pow,mw=mp(2,32);let res='',w=[],L=new TextEncoder().encode(ascii),bl=L.length*8;
  let h=[],k=[],pc=0,ic={};for(let c=2;pc<64;c++){if(!ic[c]){for(let i=0;i<313;i+=c)ic[i]=c;h[pc]=(mp(c,.5)*mw)|0;k[pc++]=(mp(c,1/3)*mw)|0;}}
  h=h.slice(0,8);const bytes=[...L,0x80];while(bytes.length%64-56)bytes.push(0);
  for(let i=0;i<bytes.length;i++)w[i>>2]|=bytes[i]<<((3-i)%4)*8;w[w.length]=((bl/mw)|0);w[w.length]=bl;
  for(let j=0;j<w.length;){const W=w.slice(j,j+=16),oh=h.slice(0);for(let i=0;i<64;i++){const w15=W[i-15],w2=W[i-2],a=h[0],e=h[4];
    const t1=h[7]+(r(e,6)^r(e,11)^r(e,25))+((e&h[5])^((~e)&h[6]))+k[i]+(W[i]=(i<16)?W[i]:(W[i-16]+(r(w15,7)^r(w15,18)^(w15>>>3))+W[i-7]+(r(w2,17)^r(w2,19)^(w2>>>10)))|0);
    const t2=(r(a,2)^r(a,13)^r(a,22))+((a&h[1])^(a&h[2])^(h[1]&h[2]));h=[(t1+t2)|0].concat(h);h[4]=(h[4]+t1)|0;h.length=8;}
    for(let i=0;i<8;i++)h[i]=(h[i]+oh[i])|0;}
  for(let i=0;i<8;i++)for(let j=3;j+1;j--){const b=(h[i]>>(j*8))&255;res+=(b<16?'0':'')+b.toString(16);}return res;
}

function setBusy(on){ const b=$('.gbtn'); if(b){ b.disabled=on; b.textContent=on?T('gWait'):T('gLogin'); } }
function authLost(){ store.del('gate_tok'); TOKEN=null; ME=null; DATA=[]; PHOTOS={}; initData(); lock(); $('#gErr').textContent=T('gExpired'); }
function setJobs(map){ for(const k in SJ) delete SJ[k]; Object.entries(map||{}).forEach(([k,v])=>{const e=toE(v); if(e) SJ[+k]=e;}); }
async function loadAll(){
  const r=await run('getData',TOKEN);
  if(!r||r.auth===false){ authLost(); return false; }
  DATA=r.data||[]; PHOTOS=r.photos||{}; setJobs(r.jobs);
  initData(); unlock(); renderStats(); renderJobs(); render(); return true;
}
let pollT=null;
function startPoll(){ clearInterval(pollT); pollT=setInterval(async()=>{ if(!TOKEN||document.hidden) return; try{ const r=await run('getJobs',TOKEN); if(!r||r.auth===false) return; const inp=$('#sjIn'); if(sjBusy||(inp&&document.activeElement===inp)) return;
  setJobs(r.jobs); render(); if(openN!=null&&$('#sjTr')) $('#sjTr').innerHTML=trHtml(SJ[openN]); }catch(e){} },30000); }
(async function initGate(){
  lock();
  try{ const s=JSON.parse(store.get('gate_tok')||'null'); if(s&&s.token){ TOKEN=s.token; ME={name:s.name,email:s.email}; } }catch{}
  if(TOKEN){ setBusy(true); try{ if(await loadAll()) startPoll(); }catch(e){ console.error(e); $('#gErr').textContent=T('gNet'); } finally{ setBusy(false); } }
})();
$('#gEye').addEventListener('click',()=>{const p=$('#gP');p.type=p.type==='password'?'text':'password';});
$('#gForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const n=$('#gN'),em=$('#gE'),p=$('#gP'),err=$('#gErr');[n,em,p].forEach(x=>x.classList.remove('bad'));err.textContent='';
  const name=n.value.trim().replace(/\s+/g,' '), email=em.value.trim();
  if(name.length<2){n.classList.add('bad');err.textContent=T('gErrName');n.focus();return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)){em.classList.add('bad');err.textContent=T('gErrEmail');em.focus();return;}
  setBusy(true);
  try{
    const r=await run('login',name,email,p.value);
    if(!r||!r.ok){ const f=r&&r.err; if(f==='pass'){p.classList.add('bad');err.textContent=T('gErrPass');p.select();} else if(f==='email'){em.classList.add('bad');err.textContent=T('gErrEmail');} else {n.classList.add('bad');err.textContent=T('gErrName');} return; }
    TOKEN=r.token; ME={name:r.name,email:r.email}; store.set('gate_tok',JSON.stringify({token:TOKEN,name:r.name,email:r.email})); p.value='';
    if(await loadAll()) startPoll();
  }catch(ex){ console.error(ex); err.textContent=T('gNet'); }
  finally{ setBusy(false); }
});
$('#logout').addEventListener('click',()=>{store.del('gate_tok');TOKEN=null;ME=null;clearInterval(pollT);if(isOpen())closeModal();DATA=[];PHOTOS={};initData();render();renderJobs();renderStats();lock();});


applyLang(); renderStats(); renderJobs(); render();

</script>
</body>
</html>
